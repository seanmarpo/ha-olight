name: release

# Push a version tag to publish a release:
#   1. bump "version" in custom_components/olight/manifest.json and commit it
#   2. git tag v0.2.1 && git push origin v0.2.1
# HACS reads versions from GitHub releases, so this is what makes an update show up there.

on:
  push:
    tags: ["v*.*.*"]

jobs:
  test:
    uses: ./.github/workflows/test.yml

  release:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Check the tag matches the manifest version
        run: |
          manifest=$(python3 -c "import json; print(json.load(open('custom_components/olight/manifest.json'))['version'])")
          tag="${GITHUB_REF_NAME#v}"
          if [ "$manifest" != "$tag" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match manifest.json version $manifest. Bump the manifest, commit, and re-tag."
            exit 1
          fi

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Tags with a pre-release suffix (v0.3.0-beta.1) are marked as pre-releases.
          prerelease=""
          case "$GITHUB_REF_NAME" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            --verify-tag \
            $prerelease
