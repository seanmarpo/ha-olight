name: test

on:
  push:
    # Branches only: a version tag runs these tests through release.yml instead.
    branches: ["**"]
  pull_request:
  workflow_dispatch:
  # Lets release.yml run the same checks before publishing.
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: Lint + decoder/client tests + Home Assistant integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          # Current Home Assistant (and its test plugin) require Python 3.14.
          python-version: "3.14"
      - run: pip install ruff pytest-homeassistant-custom-component tinytuya
      - run: python -m ruff check .
      # The decoder and client tests need no Home Assistant; the rest boot a real HA core with
      # tinytuya.Device replaced by a scripted fake, so the whole integration is exercised
      # end to end without a station.
      - run: python -m pytest tests/ -v -p no:cacheprovider
